# Profil de test — ENF7 et contrainte B6 : les tests doivent passer sur un poste
# vierge, sans Postgres installe ni lance. H2 en mode compatibilite PostgreSQL
# rejoue LES MEMES migrations Flyway que la production, ce qui verifie au passage
# que le schema versionne est bien portable.
spring:
  datasource:
    # Une base par contexte Spring : nommee pareil, H2 la partagerait entre
    # classes de test et les donnees s'accumuleraient d'une classe a l'autre.
    url: jdbc:h2:mem:presence48-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
